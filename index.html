<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e11d48">
  <title>Asma - Islamic Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #fff5f7 0%, #fdf2f4 50%, #faf0f2 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 32px rgba(225, 29, 72, 0.08);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    function App() {
      const [step, setStep] = useState(0);
      
      return (
        <div style={{ 
          minHeight: '100vh', 
          display: 'flex', 
          alignItems: 'center', 
          justifyContent: 'center',
          padding: '20px'
        }}>
          <div style={{ 
            maxWidth: '400px', 
            textAlign: 'center',
            background: 'rgba(255, 255, 255, 0.9)',
            padding: '40px',
            borderRadius: '20px',
            boxShadow: '0 8px 32px rgba(225, 29, 72, 0.15)'
          }}>
            {step === 0 && (
              <>
                <div style={{
                  width: '80px',
                  height: '80px',
                  margin: '0 auto 20px',
                  background: 'linear-gradient(135deg, #fda4b8 0%, #e11d48 100%)',
                  borderRadius: '50%',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  fontSize: '40px',
                  color: 'white'
                }}>
                  ✨
                </div>
                <h1 style={{ 
                  fontSize: '48px', 
                  margin: '0 0 10px 0',
                  color: '#881337',
                  fontWeight: '700'
                }}>
                  Asma
                </h1>
                <p style={{ 
                  fontSize: '24px', 
                  margin: '0 0 20px 0',
                  color: '#fb7193'
                }}>
                  أسماء
                </p>
                <p style={{ 
                  fontSize: '16px', 
                  color: '#be123c',
                  marginBottom: '30px',
                  lineHeight: '1.6'
                }}>
                  A safe space for Muslim women to understand their faith with clarity and compassion.
                </p>
                <button 
                  onClick={() => setStep(1)}
                  style={{
                    background: 'linear-gradient(135deg, #e11d48 0%, #be123c 100%)',
                    color: 'white',
                    border: 'none',
                    padding: '15px 40px',
                    borderRadius: '12px',
                    fontSize: '16px',
                    fontWeight: '600',
                    cursor: 'pointer',
                    boxShadow: '0 4px 12px rgba(225, 29, 72, 0.3)'
                  }}
                >
                  Begin Your Journey
                </button>
              </>
            )}
            
            {step === 1 && (
              <>
                <h2 style={{ 
                  fontSize: '28px', 
                  color: '#881337',
                  marginBottom: '30px'
                }}>
                  Welcome to Asma
                </h2>
                <div style={{ textAlign: 'left', marginBottom: '30px' }}>
                  {[
                    '✓ Verified hadith from authentic sources',
                    '✓ Female scholars cited throughout',
                    '✓ Safe space to ask difficult questions',
                    '✓ Your privacy is protected'
                  ].map((text, i) => (
                    <div key={i} style={{
                      padding: '12px',
                      marginBottom: '10px',
                      background: 'rgba(225, 29, 72, 0.05)',
                      borderRadius: '10px',
                      color: '#be123c',
                      fontSize: '14px'
                    }}>
                      {text}
                    </div>
                  ))}
                </div>
                <button 
                  onClick={() => setStep(2)}
                  style={{
                    background: 'linear-gradient(135deg, #e11d48 0%, #be123c 100%)',
                    color: 'white',
                    border: 'none',
                    padding: '15px 40px',
                    borderRadius: '12px',
                    fontSize: '16px',
                    fontWeight: '600',
                    cursor: 'pointer',
                    width: '100%'
                  }}
                >
                  Continue
                </button>
              </>
            )}
            
            {step === 2 && (
              <>
                <h2 style={{ 
                  fontSize: '28px', 
                  color: '#881337',
                  marginBottom: '20px'
                }}>
                  Revolutionary Pink UI ✨
                </h2>
                <p style={{ 
                  fontSize: '16px', 
                  color: '#be123c',
                  marginBottom: '20px',
                  lineHeight: '1.6'
                }}>
                  Your Islamic companion app is ready with:
                </p>
                <div style={{ textAlign: 'left', marginBottom: '30px' }}>
                  {[
                    '🌸 Beautiful pink theme',
                    '📿 Prayer times & Dhikr counter',
                    '📖 Quran verses & Hadith',
                    '🤲 Daily duas',
                    '👑 Stories of Sahabiyat',
                    '🔍 Universal search',
                    '💖 Ask safely feature'
                  ].map((text, i) => (
                    <div key={i} style={{
                      padding: '10px',
                      marginBottom: '8px',
                      color: '#be123c',
                      fontSize: '14px',
                      borderLeft: '3px solid #e11d48'
                    }}>
                      {text}
                    </div>
                  ))}
                </div>
                <div style={{
                  padding: '20px',
                  background: 'linear-gradient(135deg, #fff1f3 0%, #fce7f3 100%)',
                  borderRadius: '12px',
                  marginBottom: '20px',
                  color: '#881337',
                  fontSize: '14px',
                  lineHeight: '1.6'
                }}>
                  <strong>Full app coming soon!</strong><br/>
                  This is a preview of the revolutionary pink UI. The complete application with all features is being finalized.
                </div>
                <button 
                  onClick={() => setStep(0)}
                  style={{
                    background: 'linear-gradient(135deg, #e11d48 0%, #be123c 100%)',
                    color: 'white',
                    border: 'none',
                    padding: '15px 40px',
                    borderRadius: '12px',
                    fontSize: '16px',
                    fontWeight: '600',
                    cursor: 'pointer',
                    width: '100%'
                  }}
                >
                  Back to Start
                </button>
              </>
            )}
          </div>
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
