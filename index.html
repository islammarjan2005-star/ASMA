  <style>
    html { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      background: linear-gradient(180deg, #fff5f7 0%, #fdf2f4 50%, #faf0f2 100%);
      min-height: 100vh;
    }
    .dark body {
      background: linear-gradient(180deg, #1c1017 0%, #170d12 100%);
      color: #fdf2f4;
    }

    /* Gradient backgrounds for time of day */
    .bg-gradient-morning { background: linear-gradient(135deg, #fff5f7 0%, #fce7f3 50%, #fdf2f8 100%); }
    .bg-gradient-day { background: linear-gradient(135deg, #fdf2f4 0%, #fef1f5 50%, #fff5f7 100%); }
    .bg-gradient-evening { background: linear-gradient(135deg, #fce7f3 0%, #f5d0fe 30%, #fdf2f8 100%); }

    /* Glass morphism cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 32px rgba(225, 29, 72, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .dark .glass-card {
      background: rgba(40, 20, 28, 0.6);
      border: 1px solid rgba(253, 242, 244, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* Floating card effect */
    .float-card {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    }
    .float-card:active {
      transform: scale(0.97) translateY(2px);
      box-shadow: 0 4px 16px rgba(225, 29, 72, 0.06);
    }

    /* Arabic text special styling */
    .arabic-hero {
      font-family: 'Amiri', serif;
      font-size: 1.75rem;
      line-height: 2.5;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #be123c 0%, #e11d48 50%, #f43f6b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .dark .arabic-hero {
      background: linear-gradient(135deg, #fda4b8 0%, #fb7193 50%, #fecdd6 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    /* Ornamental divider */
    .ornament {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .ornament::before, .ornament::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #fda4b8, transparent);
    }

    /* Pill navigation */
    .pill-nav {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(225, 29, 72, 0.1);
      box-shadow: 0 10px 40px rgba(225, 29, 72, 0.15), 0 2px 10px rgba(0, 0, 0, 0.05);
    }
    .dark .pill-nav {
      background: rgba(40, 20, 28, 0.9);
      border: 1px solid rgba(253, 242, 244, 0.1);
    }

    /* Button glow effect */
    .btn-glow {
      position: relative;
      overflow: hidden;
    }
    .btn-glow::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300%;
      height: 300%;
      background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.5s ease;
    }
    .btn-glow:active::before {
      transform: translate(-50%, -50%) scale(1);
    }

    /* Heart burst animation */
    @keyframes heartBurst {
      0% { transform: scale(1); }
      25% { transform: scale(1.3); }
      50% { transform: scale(0.9); }
      75% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .heart-burst { animation: heartBurst 0.4s ease-out; }

    /* Ripple effect for dhikr */
    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    .ripple-effect::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(225, 29, 72, 0.3);
      animation: ripple 0.6s ease-out;
    }

    /* Breathing animation */
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.02); opacity: 1; }
    }
    .breathe { animation: breathe 4s ease-in-out infinite; }

    /* Page transitions */
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    .animate-page-in { animation: pageIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .animate-slide-in { animation: slideIn 0.3s ease-out; }
    .animate-float { animation: float 3s ease-in-out infinite; }

    /* Stagger children */
    .stagger-children > * { animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
    .stagger-children > *:nth-child(1) { animation-delay: 0.05s; }
    .stagger-children > *:nth-child(2) { animation-delay: 0.1s; }
    .stagger-children > *:nth-child(3) { animation-delay: 0.15s; }
    .stagger-children > *:nth-child(4) { animation-delay: 0.2s; }
    .stagger-children > *:nth-child(5) { animation-delay: 0.25s; }
    .stagger-children > *:nth-child(6) { animation-delay: 0.3s; }

    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }

    }

      font-family: 'Cormorant Garamond', serif;

    }

      {

        arabic: 'رُفَيْدَة الأَسْلَمِيَّة',

        era: 'Early Islam',
        image: null,
        summary: 'Pioneer of Islamic medicine and field hospitals.',
        story: `Rufaydah was a skilled healer and the first woman to establish a mobile field hospital in Islamic history. During battles, she set up a tent near the mosque where she treated the wounded.

When Sa\'d ibn Mu\'adh was severely wounded in the Battle of the Trench, the Prophet ﷺ specifically ordered that he be moved to Rufaydah's tent: "Place him in Rufaydah's tent so I can visit him nearby."

    const crisisKeywords = ['suicide', 'kill myself', 'want to die', 'abuse', 'hitting me', 'beats me', 'trapped', 'hurt myself'];

    // ============================================
    // CONTEXT & STATE
    // ============================================
    const AppContext = createContext(null);

    const moods = [
      { id: 'anxious', name: 'Anxious', emoji: '😰', color: 'amber' },
      { id: 'sad', name: 'Sad', emoji: '😢', color: 'blue' },
      { id: 'grateful', name: 'Grateful', emoji: '🤲', color: 'emerald' },
      { id: 'hopeful', name: 'Hopeful', emoji: '🌸', color: 'pink' },
      { id: 'struggling', name: 'Struggling', emoji: '💪', color: 'purple' },
      { id: 'peaceful', name: 'Peaceful', emoji: '☮️', color: 'teal' },
    ];

    const initialState = {
      onboardingComplete: false,
      darkMode: false,
      savedHadith: [],
      savedVerses: [],
      savedDuas: [],
      journal: [],
      dhikrCount: 0,
      dhikrGoal: 33,
      // Personalization
      userInterests: [],
      customCollections: [],
      readingHistory: [],
      moodTags: {},
    };

    function appReducer(state, action) {
      switch (action.type) {
        case 'COMPLETE_ONBOARDING': return { ...state, onboardingComplete: true };
        case 'SET_INTERESTS': return { ...state, userInterests: action.payload };
        case 'TOGGLE_DARK_MODE': return { ...state, darkMode: !state.darkMode };
        case 'TOGGLE_SAVED_HADITH':
          return { ...state, savedHadith: state.savedHadith.includes(action.payload)
            ? state.savedHadith.filter(id => id !== action.payload)
            : [...state.savedHadith, action.payload] };
        case 'TOGGLE_SAVED_VERSE':
          return { ...state, savedVerses: state.savedVerses.includes(action.payload)
            ? state.savedVerses.filter(id => id !== action.payload)
            : [...state.savedVerses, action.payload] };
        case 'TOGGLE_SAVED_DUA':
          return { ...state, savedDuas: state.savedDuas.includes(action.payload)
            ? state.savedDuas.filter(id => id !== action.payload)
            : [...state.savedDuas, action.payload] };
        case 'ADD_JOURNAL':
          return { ...state, journal: [{ id: Date.now(), date: new Date().toISOString(), ...action.payload }, ...state.journal] };
        case 'INCREMENT_DHIKR':
          const newCount = state.dhikrCount + 1;
          return { ...state, dhikrCount: newCount >= state.dhikrGoal ? 0 : newCount };
        case 'RESET_DHIKR': return { ...state, dhikrCount: 0 };
        case 'LOAD_STATE': return { ...state, ...action.payload };
        // Personalization
        case 'ADD_TO_HISTORY':
          const historyEntry = { ...action.payload, timestamp: Date.now() };
          const filtered = state.readingHistory.filter(h => !(h.type === historyEntry.type && h.id === historyEntry.id));
          return { ...state, readingHistory: [historyEntry, ...filtered].slice(0, 20) };
        case 'SET_MOOD_TAG':
          return { ...state, moodTags: { ...state.moodTags, [action.payload.key]: action.payload.mood } };
        case 'CREATE_COLLECTION':
          return { ...state, customCollections: [...state.customCollections, { id: Date.now(), name: action.payload, duaIds: [] }] };
        case 'DELETE_COLLECTION':
          return { ...state, customCollections: state.customCollections.filter(c => c.id !== action.payload) };
        case 'ADD_TO_COLLECTION':
          return { ...state, customCollections: state.customCollections.map(c =>
            c.id === action.payload.collectionId
              ? { ...c, duaIds: c.duaIds.includes(action.payload.duaId) ? c.duaIds : [...c.duaIds, action.payload.duaId] }
              : c
          )};
        case 'REMOVE_FROM_COLLECTION':
          return { ...state, customCollections: state.customCollections.map(c =>
            c.id === action.payload.collectionId
              ? { ...c, duaIds: c.duaIds.filter(id => id !== action.payload.duaId) }
              : c
          )};
        default: return state;
      }
    }

    function AppProvider({ children }) {
      const [state, dispatch] = useReducer(appReducer, initialState, () => {
        try {
          const saved = localStorage.getItem('asma-state');
          return saved ? { ...initialState, ...JSON.parse(saved) } : initialState;
        } catch { return initialState; }
      });

      useEffect(() => {
        localStorage.setItem('asma-state', JSON.stringify(state));
      }, [state]);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', state.darkMode);
      }, [state.darkMode]);

      return <AppContext.Provider value={{ state, dispatch }}>{children}</AppContext.Provider>;
    }

    const useApp = () => useContext(AppContext);

    // ============================================
    // UI COMPONENTS
    // ============================================
    const Card = ({ children, className = '', onClick, variant = 'default' }) => {
      const baseClasses = variant === 'glass'
        ? 'glass-card rounded-3xl'
        : 'bg-white/80 dark:bg-rose-950/40 backdrop-blur-sm rounded-3xl border border-rose-100/50 dark:border-rose-800/30 shadow-sm shadow-rose-100/50 dark:shadow-none';
      return (
        <div
          onClick={onClick}
          className={`${baseClasses} float-card ${onClick ? 'cursor-pointer' : ''} ${className}`}
        >
          {children}
        </div>
      );
    };

    const Badge = ({ children, variant = 'default' }) => {
      const variants = {
        default: 'bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-300 border border-rose-200/50 dark:border-rose-700/30',
        emerald: 'bg-gradient-to-r from-rose-50 to-pink-50 dark:from-rose-900/30 dark:to-pink-900/30 text-rose-700 dark:text-rose-300 border border-rose-200/50',
        amber: 'bg-gradient-to-r from-amber-50 to-orange-50 dark:from-amber-900/30 dark:to-orange-900/30 text-amber-700 dark:text-amber-300 border border-amber-200/50',
        rose: 'bg-gradient-to-r from-rose-100 to-pink-100 dark:from-rose-800/40 dark:to-pink-800/40 text-rose-700 dark:text-rose-200 border border-rose-300/50',
      };
      return <span className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium ${variants[variant]}`}>{children}</span>;
    };

    const Button = ({ children, onClick, disabled, className = '', icon, variant = 'primary' }) => {
      const variants = {
        primary: 'bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white shadow-lg shadow-rose-200/50 dark:shadow-rose-900/30',
        secondary: 'bg-white/80 dark:bg-rose-900/30 text-rose-700 dark:text-rose-200 border border-rose-200 dark:border-rose-700/50',
        ghost: 'bg-transparent text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-900/20',
      };
      return (
        <button
          onClick={onClick}
          disabled={disabled}
          className={`btn-glow inline-flex items-center justify-center gap-2 px-5 py-3.5 rounded-2xl font-medium transition-all duration-300 disabled:opacity-40 disabled:cursor-not-allowed ${variants[variant]} ${className}`}
        >
          {icon && <Icon name={icon} className="w-5 h-5" />}
          {children}
        </button>
      );
    }
    );

    // ============================================
    // ONBOARDING
    // ============================================
    const Onboarding = ({ onComplete, onSetInterests }) => {
      const [step, setStep] = useState(0);
      const [selectedInterests, setSelectedInterests] = useState([]);

      const interestOptions = [
        { id: 'marriage', label: 'Marriage & Relationships', icon: 'Heart' },
        { id: 'worship', label: 'Prayer & Worship', icon: 'Moon' },
        { id: 'self-worth', label: 'Self-Worth & Confidence', icon: 'Star' },
        { id: 'balance', label: 'Balance & Self-Care', icon: 'Coffee' },
        { id: 'grief', label: 'Grief & Healing', icon: 'CloudRain' },
        { id: 'motherhood', label: 'Motherhood', icon: 'Heart' },
        { id: 'anxiety', label: 'Anxiety & Stress', icon: 'Shield' },
        { id: 'divorce', label: 'Divorce & Rights', icon: 'Scale' },
      ];

      const toggleInterest = (id) => {
        setSelectedInterests(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      };

      const handleComplete = () => {
        onSetInterests(selectedInterests);
        onComplete();
      };

      return (
        <div className="min-h-screen bg-gradient-to-b from-rose-50 via-pink-50 to-white dark:from-rose-950 dark:via-pink-950 dark:to-neutral-900 flex flex-col items-center justify-center p-8">
          <div className="w-full max-w-sm animate-page-in">
            {step === 0 && (
              <div className="text-center">
                <div className="w-24 h-24 mx-auto mb-8 rounded-full bg-gradient-to-br from-rose-100 to-pink-200 dark:from-rose-800/50 dark:to-pink-800/50 flex items-center justify-center shadow-lg shadow-rose-200/50 animate-float">
                  <Icon name="Feather" className="w-10 h-10 text-rose-600 dark:text-rose-300" />
                </div>
                <h1 className="text-4xl text-elegant-bold text-rose-900 dark:text-rose-100 mb-3">Asma</h1>
                <p className="text-2xl font-arabic text-rose-400 mb-6">أسماء</p>
                <p className="text-elegant text-lg text-rose-700/70 dark:text-rose-300/70 leading-relaxed mb-12">A safe space to understand your faith with clarity and compassion.</p>
              </div>
            )}
            {step === 1 && (
              <div className="stagger-children">
                <h2 className="text-2xl text-elegant-bold text-rose-900 dark:text-rose-100 mb-8 text-center">Our Promise</h2>
                <div className="space-y-3 mb-12">
                  {['All hadith verified for authenticity', 'Female scholars cited throughout', 'AI-powered guidance with real sources', 'Your questions remain private'].map((text, i) => (
                    <div key={i} className="flex items-start gap-4 p-4 glass-card rounded-2xl">
                      <div className="w-8 h-8 rounded-full bg-gradient-to-br from-rose-400 to-pink-500 flex items-center justify-center flex-shrink-0">
                        <Icon name="CheckCircle" className="w-4 h-4 text-white" />
                      </div>
                      <p className="text-rose-800 dark:text-rose-200 text-sm pt-1">{text}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {step === 2 && (
              <div>
                <h2 className="text-2xl text-elegant-bold text-rose-900 dark:text-rose-100 mb-2 text-center">What matters to you?</h2>
                <p className="text-rose-400 text-center mb-6 text-sm">Select topics you'd like to explore</p>
                <div className="grid grid-cols-2 gap-3 mb-8 stagger-children">
                  {interestOptions.map(option => (
                    <button
                      key={option.id}
                      onClick={() => toggleInterest(option.id)}
                      className={`p-4 rounded-2xl border-2 text-left transition-all duration-300 ${
                        selectedInterests.includes(option.id)
                          ? 'border-rose-400 bg-gradient-to-br from-rose-50 to-pink-100 dark:from-rose-900/40 dark:to-pink-900/40 shadow-lg shadow-rose-200/30'
                          : 'border-rose-100 dark:border-rose-800/30 bg-white/60 dark:bg-rose-900/20'

                    >

                      <p className={`text-xs font-medium ${selectedInterests.includes(option.id) ? 'text-rose-700 dark:text-rose-200' : 'text-rose-400 dark:text-rose-400'}`}>{option.label}</p>
                    </button>

                </div>
              </div>
            )}
            <Button onClick={() => step < 2 ? setStep(step + 1) : handleComplete()} className="w-full">
              {step === 0 ? 'Begin' : step === 1 ? 'Continue' : selectedInterests.length > 0 ? 'Start My Journey' : 'Skip for Now'}
            </Button>
            <div className="flex justify-center gap-2 mt-8">
              {[0, 1, 2].map(i => (
                <div key={i} className={`h-2 rounded-full transition-all duration-500 ${i === step ? 'w-8 bg-gradient-to-r from-rose-400 to-pink-500' : 'w-2 bg-rose-200 dark:bg-rose-800'}`} />
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ============================================
    // HADITH CARD
    // ============================================
    const HadithCard = ({ hadith, onExplain, onMoodTag }) => {
      const [expanded, setExpanded] = useState(false);
      const { state, dispatch } = useApp();
      const isSaved = state.savedHadith.includes(hadith.id);
      const moodTag = state.moodTags[`hadith-${hadith.id}`];
      const mood = moods.find(m => m.id === moodTag);

      const handleSave = () => {
        const wasNotSaved = !isSaved;
        dispatch({ type: 'TOGGLE_SAVED_HADITH', payload: hadith.id });
        if (wasNotSaved && onMoodTag) {
          onMoodTag(`hadith-${hadith.id}`);
        }
      };

      // Track reading when expanded
      useEffect(() => {
        if (expanded) {
          dispatch({ type: 'ADD_TO_HISTORY', payload: { type: 'hadith', id: hadith.id } });
        }
      }, [expanded]);

      return (
        <Card className="mb-4 overflow-hidden">
          <div className="p-5">
            <div className="flex items-center justify-between mb-4">
              <div className="flex items-center gap-2">
                <Badge variant={hadith.authenticity === 'Sahih' ? 'emerald' : 'amber'}>
                  <Icon name="CheckCircle" className="w-3 h-3" /> {hadith.authenticity}
                </Badge>
                {mood && <span className="text-sm">{mood.emoji}</span>}
              </div>
              <button onClick={handleSave} className={`p-2 rounded-lg transition-colors ${isSaved ? 'bg-emerald-50 dark:bg-emerald-900/50 text-emerald-600' : 'text-neutral-400'}`}>
                <Icon name="Bookmark" className="w-4 h-4" fill={isSaved} />
              </button>
            </div>
            <div className="mb-4 py-4 border-y border-neutral-100 dark:border-neutral-700">

            <p className="text-neutral-600 dark:text-neutral-300 leading-relaxed mb-4 italic">"{hadith.text}"</p>
            <div className="flex items-center gap-2 text-sm text-neutral-400">
              <Icon name="BookOpen" className="w-4 h-4" />
              <span>{hadith.source}</span>
            </div>
          </div>
          <div className="border-t border-neutral-100 dark:border-neutral-700">
            <button onClick={() => setExpanded(!expanded)} className="w-full px-5 py-3 flex items-center justify-between text-neutral-500">
              <span className="text-sm font-medium">Context & Understanding</span>
              <Icon name="ChevronDown" className={`w-4 h-4 transition-transform ${expanded ? 'rotate-180' : ''}`} />
            </button>
            {expanded && (
              <div className="px-5 pb-5 space-y-4 animate-fade-in">

                <div className="p-4 bg-amber-50 dark:bg-amber-900/30 rounded-xl">
                  <p className="text-xs font-medium text-amber-700 dark:text-amber-400 uppercase mb-2">⚠ What This Does Not Mean</p>

                </div>
                <Button onClick={() => onExplain(hadith)} className="w-full" icon="Sparkles">Explain Gently</Button>
              </div>
            )}
          </div>
        </Card>
      );
    };

    // ============================================
    // ASK SAFELY
    // ============================================
    const AskSafely = ({ onBack }) => {
      const [question, setQuestion] = useState('');
      const [messages, setMessages] = useState([]);
      const [loading, setLoading] = useState(false);
      const [showCrisis, setShowCrisis] = useState(false);

      const suggestions = ['Is makeup permissible?', 'Can I pray in my language?', 'Can women lead prayer?'];

      const handleSubmit = async () => {
        if (!question.trim() || loading) return;
        if (crisisKeywords.some(k => question.toLowerCase().includes(k))) {
          setShowCrisis(true);
          return;
        }
        const userMsg = question.trim();
        setQuestion('');
        setMessages(prev => [...prev, { role: 'user', content: userMsg }]);
        setLoading(true);

        // Simulated response (replace with actual API call)
        setTimeout(() => {
          const response = `Thank you for your question, sister. This is an important topic.\n\nIn Islamic scholarship, there are various perspectives on this matter. I recommend consulting SeekersGuidance.org or Rabata.org for detailed scholarly answers.\n\nRemember: asking questions is a sign of engaged faith, not doubt. May Allah guide us all.`;
          setMessages(prev => [...prev, { role: 'assistant', content: response }]);
          setLoading(false);
        }, 1500);
      };

      return (
        <div className="min-h-screen bg-neutral-50 dark:bg-neutral-900 flex flex-col">
          {showCrisis && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">

                <div className="space-y-3 mb-4">
                  <a href="tel:988" className="flex items-center gap-3 p-3 bg-neutral-50 dark:bg-neutral-700 rounded-xl">
                    <Icon name="Phone" className="w-5 h-5" />
                    <div><p className="font-medium text-sm">988 Crisis Lifeline</p><p className="text-xs text-neutral-400">Call or text</p></div>
                  </a>
                  <a href="tel:18666274448" className="flex items-center gap-3 p-3 bg-neutral-50 dark:bg-neutral-700 rounded-xl">
                    <Icon name="Phone" className="w-5 h-5" />
                    <div><p className="font-medium text-sm">NASEEHA Muslim Helpline</p><p className="text-xs text-neutral-400">1-866-627-3342</p></div>
                  </a>
                </div>
                <Button onClick={() => setShowCrisis(false)} className="w-full">Continue</Button>
              </Card>
            </div>
          )}

          <div className="p-5 pt-12 max-w-lg mx-auto w-full">
            <button onClick={onBack} className="flex items-center gap-2 text-neutral-400 mb-6">
              <Icon name="ChevronLeft" className="w-5 h-5" /> Back
            </button>
            <Card className="p-5 mb-6">
              <div className="flex items-center gap-4 mb-3">
                <div className="w-12 h-12 bg-emerald-50 dark:bg-emerald-900/50 rounded-xl flex items-center justify-center">
                  <Icon name="Lock" className="w-6 h-6 text-emerald-600 dark:text-emerald-400" />
                </div>
                <div>
                  <h1 className="text-xl font-medium">Ask Safely</h1>
                  <p className="text-sm text-neutral-400">Private. No judgment.</p>
                </div>
              </div>
            </Card>
          </div>

          <div className="flex-1 overflow-y-auto px-5 max-w-lg mx-auto w-full">
            {messages.length === 0 && (
              <div className="mb-6">
                <p className="text-xs font-medium text-neutral-400 uppercase mb-3">Try asking</p>
                <div className="flex flex-wrap gap-2">
                  {suggestions.map((s, i) => (
                    <button key={i} onClick={() => setQuestion(s)} className="px-3 py-2 bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-lg text-sm">{s}</button>
                  ))}
                </div>
              </div>
            )}
            {messages.map((msg, i) => (
              <div key={i} className={`mb-4 ${msg.role === 'user' ? 'flex justify-end' : ''}`}>
                <div className={`max-w-[85%] p-4 rounded-2xl ${msg.role === 'user' ? 'bg-neutral-800 text-white rounded-br-md' : 'bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-bl-md'}`}>
                  <p className="text-sm whitespace-pre-line">{msg.content}</p>
                </div>
              </div>
            ))}
            {loading && (
              <div className="mb-4">
                <div className="max-w-[85%] p-4 bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-2xl">
                  <div className="flex gap-2">
                    <div className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse" />
                    <div className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse" style={{ animationDelay: '0.2s' }} />
                    <div className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse" style={{ animationDelay: '0.4s' }} />
                  </div>
                </div>
              </div>
            )}
          </div>

    // ============================================
    // PRAYER TIMES
    // ============================================
    const PrayerTimes = ({ onBack }) => {
      const [prayerTimes, setPrayerTimes] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const fetchPrayerTimes = async (lat, lng) => {
        try {
          setLoading(true);
          const today = new Date();
          const date = `${today.getDate()}-${today.getMonth() + 1}-${today.getFullYear()}`;

          const response = await fetch(
            `https://api.aladhan.com/v1/timings/${date}?latitude=${lat}&longitude=${lng}&method=2`
          );

          if (!response.ok) throw new Error('Failed to fetch prayer times');

          const data = await response.json();
          setPrayerTimes({
            fajr: data.data.timings.Fajr,
            sunrise: data.data.timings.Sunrise,
            dhuhr: data.data.timings.Dhuhr,
            asr: data.data.timings.Asr,
            maghrib: data.data.timings.Maghrib,
            isha: data.data.timings.Isha,
            date: data.data.date.readable,
            hijriDate: `${data.data.date.hijri.day} ${data.data.date.hijri.month.en} ${data.data.date.hijri.year}`,
          });
          setError(null);
        } catch (err) {
          console.error('Prayer times error:', err);
          setError('Unable to fetch prayer times');
          setPrayerTimes({
            fajr: '05:30',
            sunrise: '06:45',
            dhuhr: '12:30',
            asr: '15:45',
            maghrib: '18:15',
            isha: '19:45',
            date: new Date().toLocaleDateString(),
            hijriDate: '',
          });
        } finally {
          setLoading(false);
        }
      };

      const getLocation = () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const { latitude, longitude } = position.coords;
              fetchPrayerTimes(latitude, longitude);
            },
            (err) => {
              console.error('Geolocation error:', err);
              fetchPrayerTimes(21.4225, 39.8262); // Default to Mecca
            }
          );
        } else {
          fetchPrayerTimes(21.4225, 39.8262); // Default to Mecca
        }
      };

      useEffect(() => {
        getLocation();
      }, []);

      const getNextPrayer = () => {
        if (!prayerTimes) return null;
        const now = new Date();
        const currentTime = now.getHours() * 60 + now.getMinutes();
        const prayers = [
          { name: 'Fajr', time: prayerTimes.fajr },
          { name: 'Dhuhr', time: prayerTimes.dhuhr },
          { name: 'Asr', time: prayerTimes.asr },
          { name: 'Maghrib', time: prayerTimes.maghrib },
          { name: 'Isha', time: prayerTimes.isha },
        ];
        for (const prayer of prayers) {
          const [hours, minutes] = prayer.time.split(':').map(Number);
          const prayerMinutes = hours * 60 + minutes;
          if (prayerMinutes > currentTime) return prayer;
        }
        return prayers[0];
      };

      const nextPrayer = getNextPrayer();
      const prayersData = prayerTimes ? [
        { key: 'fajr', name: 'Fajr', time: prayerTimes.fajr, icon: 'Sunrise', isNext: nextPrayer?.name === 'Fajr' },
        { key: 'sunrise', name: 'Sunrise', time: prayerTimes.sunrise, icon: 'Sun', isNext: false },
        { key: 'dhuhr', name: 'Dhuhr', time: prayerTimes.dhuhr, icon: 'Sun', isNext: nextPrayer?.name === 'Dhuhr' },
        { key: 'asr', name: 'Asr', time: prayerTimes.asr, icon: 'Sun', isNext: nextPrayer?.name === 'Asr' },
        { key: 'maghrib', name: 'Maghrib', time: prayerTimes.maghrib, icon: 'Sunrise', isNext: nextPrayer?.name === 'Maghrib' },
        { key: 'isha', name: 'Isha', time: prayerTimes.isha, icon: 'Moon', isNext: nextPrayer?.name === 'Isha' },
      ] : [];

      return (
        <div className="min-h-screen pb-24 bg-gradient-morning dark:bg-neutral-900">
          <div className="p-5 pt-12 max-w-lg mx-auto">
            <div className="flex items-center justify-between mb-6">
              <button onClick={onBack} className="flex items-center gap-2 text-rose-400 active:text-rose-600 transition-colors">
                <Icon name="ChevronLeft" />
                <span className="text-sm">Back</span>
              </button>
              <button onClick={getLocation} className="p-2 rounded-lg text-rose-400 active:bg-rose-50 dark:active:bg-neutral-800 transition-colors">
                <Icon name="RotateCcw" className={loading ? 'animate-spin' : ''} />
              </button>
            </div>

            <div className="glass-card rounded-3xl p-6 mb-6 text-center float-card">
              <div className="flex items-center justify-center gap-2 text-rose-400 mb-2">
                <Icon name="Coffee" className="w-4 h-4" />
                <span className="text-sm">{prayerTimes?.date || 'Loading...'}</span>
              </div>
              {prayerTimes?.hijriDate && (
                <p className="text-lg font-medium text-rose-900 dark:text-rose-100">{prayerTimes.hijriDate}</p>
              )}
              <div className="flex items-center justify-center gap-1 mt-2 text-rose-400">
                <Icon name="Circle" className="w-3 h-3" />
                <span className="text-xs">Based on your location</span>
              </div>
            </div>

            {nextPrayer && (
              <div className="glass-card rounded-3xl p-5 mb-6 border-2 border-rose-200 dark:border-rose-900 breathe">
                <p className="text-xs font-medium text-rose-600 dark:text-rose-400 uppercase tracking-wide mb-1">Next Prayer</p>
                <div className="flex items-center justify-between">
                  <h2 className="text-2xl font-medium text-rose-900 dark:text-rose-100">{nextPrayer.name}</h2>
                  <p className="text-2xl font-light text-rose-600 dark:text-rose-400">{nextPrayer.time}</p>
                </div>
              </div>
            )}

            {loading ? (
              <div className="flex items-center justify-center py-12">
                <div className="w-8 h-8 border-2 border-rose-200 dark:border-rose-600 border-t-rose-600 rounded-full animate-spin" />
              </div>
            ) : error ? (
              <div className="glass-card rounded-3xl p-6 text-center float-card">
                <p className="text-rose-500 dark:text-rose-400">{error}</p>
                <button onClick={getLocation} className="mt-4 text-rose-600 dark:text-rose-400 text-sm font-medium">Try Again</button>
              </div>
            ) : (
              <div className="space-y-2">
                {prayersData.map((prayer) => (
                  <div key={prayer.key} className={`glass-card rounded-2xl p-4 float-card ${prayer.isNext ? 'ring-2 ring-rose-500 dark:ring-rose-400' : ''}`}>
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${prayer.isNext ? 'bg-rose-100 dark:bg-rose-900/50' : 'bg-rose-50 dark:bg-neutral-700'}`}>
                          <Icon name={prayer.icon} className={`w-5 h-5 ${prayer.isNext ? 'text-rose-600 dark:text-rose-400' : 'text-rose-400 dark:text-rose-500'}`} />
                        </div>
                        <span className={`font-medium ${prayer.isNext ? 'text-rose-600 dark:text-rose-400' : 'text-rose-700 dark:text-rose-200'}`}>

                        </span>

                      <span className={`text-lg ${prayer.isNext ? 'font-medium text-rose-600 dark:text-rose-400' : 'text-rose-600 dark:text-rose-300'}`}>
                        {prayer.time}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            )}

            <div className="glass-card rounded-2xl p-4 mt-6 float-card">
              <p className="text-xs text-rose-500 dark:text-rose-400 leading-relaxed">
                Prayer times calculated using ISNA method. Times may vary slightly. For most accurate times, consult your local mosque.
              </p>
            </div>
          </div>
        </div>
      );
    };

                  {recentHistory.map((item, i) => {
                    const content = item.type === 'hadith' ? hadithDatabase.find(h => h.id === item.id) :
                                   item.type === 'verse' ? quranicVerses.find(v => v.id === item.id) :
                                   item.type === 'dua' ? duasDatabase.find(d => d.id === item.id) : null;
                    if (!content) return null;
                    return (
                      <Card key={i} className="p-4 min-w-[200px] flex-shrink-0" onClick={() => onContinueReading(item)}>
                        <p className="text-xs text-rose-500 capitalize mb-2 font-medium">{item.type}</p>
                        <p className="text-sm text-rose-700 dark:text-rose-300 line-clamp-2">
                          {item.type === 'hadith' ? content.text?.substring(0, 50) + '...' :
                           item.type === 'verse' ? content.translation?.substring(0, 50) + '...' :
                           content.translation?.substring(0, 50) + '...'}
                        </p>
                      </Card>
                    );
                  })}
                </div>
              </div>
            )}

            {/* For You - Based on Interests */}
            {forYouTopics.length > 0 && (
              <div className="mb-8">
                <h2 className="text-xs font-semibold text-rose-500 uppercase tracking-wider mb-4">For You</h2>
                <div className="flex gap-3 overflow-x-auto hide-scrollbar pb-2">
                  {forYouTopics.map(topic => (
                    <Card key={topic.id} className="p-4 min-w-[150px] flex-shrink-0" onClick={() => onSelectTopic(topic)}>
                      <div className="w-12 h-12 bg-gradient-to-br from-rose-100 to-pink-200 dark:from-rose-800/50 dark:to-pink-800/50 rounded-2xl flex items-center justify-center mb-3">
                        <Icon name={topic.icon} className="w-6 h-6 text-rose-600 dark:text-rose-300" />
                      </div>
                      <h3 className="font-medium text-sm text-rose-800 dark:text-rose-200">{topic.name}</h3>
                      <p className="text-xs text-rose-400">{hadithDatabase.filter(h => h.topic === topic.id).length} hadith</p>
                    </Card>
                  ))}
                </div>
              </div>
            )}

            {/* Main Action Cards */}
            <div className="grid grid-cols-2 gap-4 mb-8">
              <Card className="p-5 relative overflow-hidden" onClick={onAskSafely}>
                <div className="absolute -top-4 -right-4 w-20 h-20 bg-gradient-to-bl from-rose-200/40 to-transparent rounded-full" />
                <div className="w-12 h-12 bg-gradient-to-br from-rose-400 to-pink-500 rounded-2xl flex items-center justify-center mb-3 shadow-lg shadow-rose-300/30">
                  <Icon name="Lock" className="w-6 h-6 text-white" />
                </div>
                <h3 className="font-semibold text-rose-800 dark:text-rose-200">Ask Safely</h3>
                <p className="text-xs text-rose-400 mt-1">AI-powered guidance</p>
              </Card>
              <Card className="p-5 relative overflow-hidden" onClick={onCultureVsIslam}>
                <div className="absolute -top-4 -right-4 w-20 h-20 bg-gradient-to-bl from-amber-200/40 to-transparent rounded-full" />
                <div className="w-12 h-12 bg-gradient-to-br from-amber-400 to-orange-500 rounded-2xl flex items-center justify-center mb-3 shadow-lg shadow-amber-300/30">
                  <Icon name="Scale" className="w-6 h-6 text-white" />
                </div>
                <h3 className="font-semibold text-rose-800 dark:text-rose-200">Culture vs Islam</h3>
                <p className="text-xs text-rose-400 mt-1">Know the difference</p>
              </Card>
            </div>

            {/* Quick Access Grid */}
            <div className="grid grid-cols-4 gap-3 mb-8 stagger-children">
              <Card className="p-4 text-center" onClick={onQuran}>
                <div className="w-12 h-12 mx-auto bg-gradient-to-br from-rose-100 to-pink-200 dark:from-rose-800/40 dark:to-pink-800/40 rounded-2xl flex items-center justify-center mb-2">
                  <Icon name="BookOpen" className="w-5 h-5 text-rose-600 dark:text-rose-300" />
                </div>
                <p className="text-xs font-medium text-rose-700 dark:text-rose-300">Quran</p>
              </Card>
              <Card className="p-4 text-center" onClick={onDuas}>
                <div className="w-12 h-12 mx-auto bg-gradient-to-br from-pink-100 to-rose-200 dark:from-pink-800/40 dark:to-rose-800/40 rounded-2xl flex items-center justify-center mb-2">
                  <Icon name="Heart" className="w-5 h-5 text-pink-600 dark:text-pink-300" />
                </div>
                <p className="text-xs font-medium text-rose-700 dark:text-rose-300">Duas</p>
              </Card>
              <Card className="p-4 text-center" onClick={onSahabiyat}>
                <div className="w-12 h-12 mx-auto bg-gradient-to-br from-fuchsia-100 to-pink-200 dark:from-fuchsia-800/40 dark:to-pink-800/40 rounded-2xl flex items-center justify-center mb-2">
                  <Icon name="Users" className="w-5 h-5 text-fuchsia-600 dark:text-fuchsia-300" />
                </div>
                <p className="text-xs font-medium text-rose-700 dark:text-rose-300">Sahabiyat</p>
              </Card>
              <Card className="p-4 text-center" onClick={onCollections}>
                <div className="w-12 h-12 mx-auto bg-gradient-to-br from-purple-100 to-fuchsia-200 dark:from-purple-800/40 dark:to-fuchsia-800/40 rounded-2xl flex items-center justify-center mb-2">
                  <Icon name="Bookmark" className="w-5 h-5 text-purple-600 dark:text-purple-300" />
                </div>
                <p className="text-xs font-medium text-rose-700 dark:text-rose-300">Collections</p>
              </Card>
            </div>

            {/* Journal Card */}
            <Card className="p-4 mb-8" onClick={onJournal}>
              <div className="flex items-center gap-4">
                <div className="w-14 h-14 bg-gradient-to-br from-violet-100 to-purple-200 dark:from-violet-800/40 dark:to-purple-800/40 rounded-2xl flex items-center justify-center">
                  <Icon name="Edit3" className="w-6 h-6 text-violet-600 dark:text-violet-300" />
                </div>
                <div className="flex-1">
                  <p className="font-semibold text-rose-800 dark:text-rose-200">Reflection Journal</p>
                  <p className="text-xs text-rose-400 mt-0.5">{state.journal.length} entries</p>
                </div>
                <Icon name="ChevronRight" className="w-5 h-5 text-rose-300" />
              </div>
            </Card>

            {/* Explore Topics */}
            <h2 className="text-xs font-semibold text-rose-400 uppercase tracking-wider mb-4">Explore Topics</h2>
            <div className="space-y-3 stagger-children">
              {topics.map(topic => (
                <Card key={topic.id} className="p-4" onClick={() => onSelectTopic(topic)}>
                  <div className="flex items-center gap-4">
                    <div className="w-12 h-12 bg-gradient-to-br from-rose-50 to-pink-100 dark:from-rose-800/30 dark:to-pink-800/30 rounded-2xl flex items-center justify-center">
                      <Icon name={topic.icon} className="w-5 h-5 text-rose-500 dark:text-rose-400" />
                    </div>
                    <div className="flex-1">
                      <h3 className="font-medium text-rose-800 dark:text-rose-200">{topic.name}</h3>
                      <p className="text-xs text-rose-400">{topic.description}</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="text-xs text-rose-400 bg-rose-50 dark:bg-rose-900/30 px-2 py-1 rounded-full">{hadithDatabase.filter(h => h.topic === topic.id).length}</span>
                      <Icon name="ChevronRight" className="w-4 h-4 text-rose-300" />
                    </div>
                  </div>
                </Card>
              ))}
            </div>

            {/* Footer Note */}
            <Card className="p-4 mt-8 bg-rose-50/50 dark:bg-rose-900/20 border-rose-100 dark:border-rose-800/20">
              <div className="flex items-start gap-3">
                <Icon name="Info" className="w-5 h-5 text-rose-400 flex-shrink-0" />
                <p className="text-xs text-rose-500 dark:text-rose-400 leading-relaxed">Asma provides educational guidance with Islamic sources. This is not a substitute for scholarly advice.</p>
              </div>
            </Card>
          </div>
        </div>
      );
    };

    // ============================================
    // BOTTOM NAV - Floating Pill Style
    // ============================================
    const BottomNav = ({ activeTab, onTabChange }) => {
      const items = [
        { id: 'home', icon: 'Home', label: 'Home' },
        { id: 'dhikr', icon: 'Circle', label: 'Dhikr' },
        { id: 'saved', icon: 'Bookmark', label: 'Saved' },
        { id: 'settings', icon: 'Settings', label: 'Settings' },
      ];
      return (
        <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 z-40">
          <div className="pill-nav flex items-center gap-1 p-2 rounded-full">
            {items.map(item => (
              <button
                key={item.id}
                onClick={() => onTabChange(item.id)}
                className={`relative flex flex-col items-center py-2.5 px-5 rounded-full transition-all duration-300 ${
                  activeTab === item.id
                    ? 'bg-gradient-to-r from-rose-500 to-pink-500 text-white shadow-lg shadow-rose-300/40'
                    : 'text-rose-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-900/20'
                }`}
              >
                <Icon name={item.icon} className={`w-5 h-5 transition-transform duration-300 ${activeTab === item.id ? 'scale-110' : ''}`} fill={item.id === 'dhikr' && activeTab === item.id} />
                {activeTab === item.id && (
                  <span className="text-[10px] font-medium mt-0.5 animate-fade-in">{item.label}</span>
                )}
              </button>
            ))}
          </div>
        </nav>
      );
    };

    // ============================================
    // SAVED VIEW
    // ============================================
    const SavedView = ({ onBack }) => {
      const { state } = useApp();
      const [filterMood, setFilterMood] = useState(null);

      const savedHadith = hadithDatabase.filter(h => state.savedHadith.includes(h.id));
      const savedVerses = quranicVerses.filter(v => state.savedVerses.includes(v.id));

      // Filter by mood if selected
      const filteredHadith = filterMood
        ? savedHadith.filter(h => state.moodTags[`hadith-${h.id}`] === filterMood)
        : savedHadith;
      const filteredVerses = filterMood
        ? savedVerses.filter(v => state.moodTags[`verse-${v.id}`] === filterMood)
        : savedVerses;

      // Get unique moods from saved items
      const savedMoods = [...new Set([
        ...savedHadith.map(h => state.moodTags[`hadith-${h.id}`]),
        ...savedVerses.map(v => state.moodTags[`verse-${v.id}`])
      ])].filter(Boolean);

      return (
        <div className="min-h-screen bg-neutral-50 dark:bg-neutral-900 pb-24">
          <div className="p-5 pt-12 max-w-lg mx-auto">
            <button onClick={onBack} className="flex items-center gap-2 text-neutral-400 mb-6">
              <Icon name="ChevronLeft" className="w-5 h-5" /> Back
            </button>
            <Card className="p-5 mb-6">
              <div className="flex items-center gap-4">
                <div className="w-12 h-12 bg-amber-50 dark:bg-amber-900/50 rounded-xl flex items-center justify-center">
                  <Icon name="Bookmark" className="w-6 h-6 text-amber-600 dark:text-amber-400" />
                </div>
                <div>
                  <h1 className="text-xl font-medium">Saved</h1>
                  <p className="text-sm text-neutral-400">{savedHadith.length + savedVerses.length} items</p>
                </div>
              </div>
            </Card>

            {/* Mood Filter */}
            {savedMoods.length > 0 && (
              <div className="mb-4">
                <p className="text-xs font-medium text-neutral-400 uppercase mb-2">Filter by mood</p>
                <div className="flex gap-2 flex-wrap">
                  <button
                    onClick={() => setFilterMood(null)}
                    className={`px-3 py-1.5 rounded-full text-sm ${!filterMood ? 'bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700' : 'bg-neutral-100 dark:bg-neutral-800 text-neutral-500'}`}
                  >All</button>
                  {savedMoods.map(moodId => {
                    const mood = moods.find(m => m.id === moodId);
                    return mood ? (
                      <button
                        key={mood.id}
                        onClick={() => setFilterMood(mood.id)}
                        className={`px-3 py-1.5 rounded-full text-sm flex items-center gap-1 ${filterMood === mood.id ? 'bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700' : 'bg-neutral-100 dark:bg-neutral-800 text-neutral-500'}`}
                      >
                        <span>{mood.emoji}</span> {mood.name}
                      </button>
                    ) : null;
                  })}
                </div>
              </div>
            )}

            {savedHadith.length === 0 && savedVerses.length === 0 ? (
              <Card className="p-8 text-center">
                <Icon name="Bookmark" className="w-12 h-12 text-neutral-300 mx-auto mb-4" />
                <p className="text-neutral-500">Nothing saved yet.</p>
              </Card>
            ) : filteredHadith.length === 0 && filteredVerses.length === 0 ? (
              <Card className="p-8 text-center">
                <p className="text-neutral-500">No items match this mood.</p>
              </Card>
            ) : (
              <div className="space-y-4">
                {filteredHadith.map(h => {
                  const moodTag = state.moodTags[`hadith-${h.id}`];
                  const mood = moods.find(m => m.id === moodTag);
                  return (
                    <Card key={h.id} className="p-4">
                      <div className="flex items-center justify-between mb-2">
                        <Badge variant={h.authenticity === 'Sahih' ? 'emerald' : 'amber'}>{h.authenticity}</Badge>
                        {mood && <span className="text-sm">{mood.emoji}</span>}
                      </div>
                      <p className="text-sm text-neutral-600 dark:text-neutral-300 italic line-clamp-2">"{h.text}"</p>
                      <p className="text-xs text-neutral-400 mt-2">{h.source}</p>
                    </Card>
                  );
                })}
                {filteredVerses.map(v => {
                  const moodTag = state.moodTags[`verse-${v.id}`];
                  const mood = moods.find(m => m.id === moodTag);
                  return (
                    <Card key={v.id} className="p-4">
                      <div className="flex items-center justify-between mb-2">
                        <Badge variant="rose">{v.theme}</Badge>
                        {mood && <span className="text-sm">{mood.emoji}</span>}
                      </div>
                      <p className="text-sm text-neutral-600 dark:text-neutral-300 italic line-clamp-2">"{v.translation}"</p>
                      <p className="text-xs text-neutral-400 mt-2">{v.reference}</p>
                    </Card>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    };

    // ============================================
    // EXPLANATION MODAL
    // ============================================
    const ExplanationModal = ({ hadith, onClose }) => {
      const explanations = {
        1: "This hadith is beautifully clear: your consent matters.\n\nThe Prophet ﷺ lived in a time when women were often treated as property—yet he insisted that no woman could be married without her genuine agreement.\n\nIf anyone uses culture or family pressure to override your choice, that contradicts this clear teaching. You have every right to say no.",
        2: "When Aisha got her period during Hajj, she cried. She felt she had ruined everything.\n\nLook at how the Prophet ﷺ responded—with tender words: 'Allah wrote this.' The exemption from prayer is mercy, not punishment.\n\nYour cycle is not a barrier between you and Allah.",
        3: "In a world that judges women by appearance—this hadith is revolutionary.\n\nAllah says: I don't look at that. He looks at your heart and deeds.\n\nYour worth is not in your dress size or relationship status. You are already enough in Allah's eyes.",
        4: "If you're exhausted—spiritually, mentally, emotionally—this hadith speaks to you.\n\nThe Prophet ﷺ taught that your own self has a right over you. Rest is not laziness.\n\nAllah wants your worship for a lifetime, not a burnout.",
        5: "This hadith is often misused to trap women. Let's be clear: divorce is halal.\n\n'The most disliked of permissible things'—it is still permissible.\n\nIf you're in an abusive marriage, seeking divorce is using a door Allah Himself left open.",
        6: "The Prophet ﷺ—the best of creation—wept when his son died. He didn't hide his tears.\n\nFeeling devastated is not lack of faith. It's being human. You can cry and still trust Allah.",
        7: "This hadith honors mothers immensely—but it should empower, not exhaust you.\n\nYou don't have to do everything. You don't have to be everything.\n\nYour humanity doesn't diminish your honor as a mother.",
        8: "Haya is often reduced to women's clothing, but it's so much deeper.\n\nIt's about inner dignity, conscience, and awareness of Allah.\n\nTrue haya is empowerment through self-respect, not restriction through shame.",
      };

      return (
        <div className="fixed inset-0 bg-black/30 flex items-end sm:items-center justify-center z-50 p-4">
          <div className="bg-white dark:bg-neutral-800 rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[80vh] overflow-hidden animate-slide-up">
            <div className="p-5 border-b border-neutral-100 dark:border-neutral-700 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-emerald-50 dark:bg-emerald-900/50 rounded-xl flex items-center justify-center">
                  <Icon name="Sparkles" className="w-5 h-5 text-emerald-600 dark:text-emerald-400" />
                </div>
                <div>
                  <h3 className="font-medium">Gentle Explanation</h3>
                  <p className="text-xs text-neutral-400">For your understanding</p>
                </div>
              </div>
              <button onClick={onClose} className="p-2">
                <Icon name="X" className="w-5 h-5 text-neutral-400" />
              </button>
            </div>
            <div className="p-5 overflow-y-auto max-h-[50vh]">
              <p className="text-neutral-600 dark:text-neutral-300 leading-relaxed whitespace-pre-line">
                {explanations[hadith.id] || "This teaching reflects the mercy and wisdom in Islam's guidance. The Prophet ﷺ taught through both word and action.\n\nFor deeper questions, consult a qualified scholar."}
              </p>
            </div>
            <div className="p-4 bg-amber-50 dark:bg-amber-900/30 border-t border-amber-100 dark:border-amber-800">
              <p className="text-xs text-amber-700 dark:text-amber-400 flex items-center gap-2">
                <Icon name="Info" className="w-4 h-4 flex-shrink-0" />
                This is educational context, not a fatwa. For personal rulings, consult a qualified scholar.
              </p>
            </div>
          </div>
        </div>
      );
    };

    // ============================================
    // MAIN APP
    // ============================================
    function AppContent() {
      const { state, dispatch } = useApp();
      const [view, setView] = useState('home');
      const [activeTab, setActiveTab] = useState('home');
      const [selectedTopic, setSelectedTopic] = useState(null);
      const [explainHadith, setExplainHadith] = useState(null);
      const [moodTagItem, setMoodTagItem] = useState(null);

      if (!state.onboardingComplete) {
        return <Onboarding
          onComplete={() => dispatch({ type: 'COMPLETE_ONBOARDING' })}
          onSetInterests={(interests) => dispatch({ type: 'SET_INTERESTS', payload: interests })}
        />;
      }

      const handleTabChange = (tab) => {
        setActiveTab(tab);
        setView(tab);
      };

      const handleContinueReading = (item) => {
        if (item.type === 'hadith') {
          const hadith = hadithDatabase.find(h => h.id === item.id);
          if (hadith) {
            const topic = topics.find(t => t.id === hadith.topic);
            if (topic) { setSelectedTopic(topic); setView('topic'); }
          }
        } else if (item.type === 'verse') {
          setView('quran');
        } else if (item.type === 'dua') {
          setView('duas');
        }
      };

      const renderContent = () => {
        switch (view) {
          case 'home':
            return (
              <HomeScreen
                onSelectTopic={(topic) => { setSelectedTopic(topic); setView('topic'); }}
                onAskSafely={() => setView('ask')}
                onCultureVsIslam={() => setView('culture')}
                onQuran={() => setView('quran')}
                onDuas={() => setView('duas')}
                onSahabiyat={() => setView('sahabiyat')}
                onJournal={() => setView('journal')}
                onCollections={() => setView('collections')}
                onContinueReading={handleContinueReading}
              />
            );
          case 'topic':
            return <TopicView topic={selectedTopic} onBack={() => { setView('home'); setSelectedTopic(null); }} onExplain={setExplainHadith} onMoodTag={setMoodTagItem} />;
          case 'collections':
            return <MyCollections onBack={() => setView('home')} />;
          case 'ask':
            return <AskSafely onBack={() => setView('home')} />;
          case 'culture':
            return <CultureVsIslamView onBack={() => setView('home')} />;
          case 'quran':
            return <QuranView onBack={() => setView('home')} />;
          case 'duas':
            return <DuasView onBack={() => setView('home')} />;
          case 'sahabiyat':
            return <SahabiyatView onBack={() => setView('home')} />;
          case 'journal':
            return <Journal onBack={() => setView('home')} />;
          case 'dhikr':
            return <DhikrCounter onBack={() => { setView('home'); setActiveTab('home'); }} />;
          case 'saved':
            return <SavedView onBack={() => { setView('home'); setActiveTab('home'); }} />;
          case 'settings':
            return <Settings onBack={() => { setView('home'); setActiveTab('home'); }} />;
          default:
            return <HomeScreen />;
        }
      };

      return (
        <div className="max-w-lg mx-auto">
          {renderContent()}
          <BottomNav activeTab={activeTab} onTabChange={handleTabChange} />
          {explainHadith && <ExplanationModal hadith={explainHadith} onClose={() => setExplainHadith(null)} />}
          {moodTagItem && <MoodTagModal itemKey={moodTagItem} onClose={() => setMoodTagItem(null)} />}
        </div>
      );
    }

    function App() {
      return (
        <AppProvider>
          <AppContent />
        </AppProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
